  width="100%"
  height="100%"
  viewBox="0 0 1920 1080"
  preserveAspectRatio="none">

  <foreignObject x="0" y="0" width="100%" height="100%">
    <xhtml:html xmlns="http://www.w3.org/1999/xhtml">
      <xhtml:head>
        <xhtml:style>
