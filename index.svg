<xhtml:style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .iframe-container {
    width: 100%;
    height: 100%;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    transform-origin: top center;
  }

  /* Phones */
  @media (max-width: 600px) {
    iframe {
      transform: scale(0.85);
    }
  }

  /* Tablets */
  @media (min-width: 601px) and (max-width: 1024px) {
    iframe {
      transform: scale(0.95);
    }
  }

  /* Desktops */
  @media (min-width: 1025px) {
    iframe {
      transform: scale(1);
    }
  }
</xhtml:style>

<xhtml:body>
  <xhtml:div class="iframe-container">
    <xhtml:iframe
      src="https://quantum-services-theta.vercel.app"
      sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
      allowfullscreen="true"
      referrerpolicy="no-referrer"
      loading="lazy">
    </xhtml:iframe>
  </xhtml:div>
</xhtml:body>
