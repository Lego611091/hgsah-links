<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xhtml="http://www.w3.org/1999/xhtml"
  width="100%"
  height="100%"
  viewBox="0 0 1920 1080"
  preserveAspectRatio="none">

  <foreignObject x="0" y="0" width="100%" height="100%">
    <xhtml:html xmlns="http://www.w3.org/1999/xhtml" lang="en">
      <xhtml:head>
        <xhtml:meta charset="UTF-8" />
        <xhtml:meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <xhtml:style>
          html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
          }
          .iframe-container {
            width: 100%;
            height: 100%;
          }
          iframe {
            width: 100%;
            height: 100%;
            border: none;
          }
        </xhtml:style>
      </xhtml:head>

      <xhtml:body>
        <xhtml:div class="iframe-container">
          <xhtml:iframe
            src="https://quantum-services-theta.vercel.app"
            sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
            allowfullscreen="true"
            referrerpolicy="no-referrer"
            loading="lazy">
          </xhtml:iframe>
        </xhtml:div>
      </xhtml:body>
    </xhtml:html>
  </foreignObject>
</svg>
